name: Oldal generálása

on:
  schedule:
    # 23:30 UTC = 00:30 (téli idő) / 01:30 (nyári idő) budapesti idő szerint,
    # tehát mindig röviddel magyar éjfél után fut le.
    - cron: '30 23 * * *'
  push:
    branches: [master]
  workflow_dispatch:        # kézzel is indítható a GitHub felületéről

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP telepítése
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Generálás
        run: ./build.sh

      - name: Közzététel
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "Nincs változás, nincs commit."
            exit 0
          fi
          git commit -m "Oldal frissítve: $(TZ=Europe/Budapest date '+%Y-%m-%d %H:%M') (automatikus)"
          # Ha közben más is pusholt, újrapróbáljuk, hogy a napi frissítés ne vesszen el.
          for i in 1 2 3; do
            if git push; then
              echo "Push sikeres."
              exit 0
            fi
            echo "Push nem sikerult (probalkozas $i), rebase es ujraprobalas..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::error::A napi frissitest nem sikerult kipusholni 3 probalkozas utan."
          exit 1

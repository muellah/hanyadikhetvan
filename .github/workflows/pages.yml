# ÉLES: 2026-09-24 óta ez szolgálja ki a hanyadikhetvan.hu-t (GitHub Pages).
#
# Naponta fut, és kézzel is indítható (Actions fül -> "GitHub Pages" -> Run workflow).
# A build.yml továbbra is commitolja a dist/ mappát: ez tartja aktívnak a repót (a GitHub
# 60 nap inaktivitás után letiltja az ütemezett workflow-kat), és tartalékként megőrzi a
# kész oldalt. A Netlify automatikus buildje ki van kapcsolva (stop_builds), így az a
# commit már nem fogyaszt Netlify-kreditet.
#
# Visszaút a Netlify-ra: lásd docs/DNS-atallas.md.
name: GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '35 23 * * *'   # 00:35 / 01:35 budapesti idő, 5 perccel a dist-commit után

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: PHP telepítése
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Generálás
        run: ./build.sh

      - uses: actions/configure-pages@v5

      - name: Feltöltés
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Közzététel
        id: deployment
        uses: actions/deploy-pages@v4
